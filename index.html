function cal(){const y=Math.floor(mi/12),m=mi%12;
 $("m").textContent=MN[m]+" "+y;$("p").disabled=mi<=MIN;$("n").disabled=mi>=MAX;
 const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let h="SMTWTFS".split("").map(x=>`<div class="w">${x}</div>`).join("")+'<div class="d o"></div>'.repeat(first);
 for(let d=1;d<=days;d++){const k=iso(y,m,d),n=D.filter(e=>e[0]===k).length;
  h+=`<div class="d${k===today?" t":""}${k===sel?" s":""}" data-k="${k}">${d}<span class="dots">${"<i></i>".repeat(Math.min(n,4))}</span></div>`}
 $("g").innerHTML=h;
 const pre=iso(y,m,1).slice(0,7),L=D.filter(e=>sel?e[0]===sel:e[0].startsWith(pre));
 $("lt").textContent=sel?"Moments on "+sel:L.length+" moments in "+MN[m];$("cl").hidden=!sel;
 $("cc").innerHTML=L.length?L.map(card).join(""):'<div class="e">No events — rest day 😴</div>';
 $("g").querySelectorAll(".d:not(.o)").forEach(c=>c.onclick=()=>{sel=sel===c.dataset.k?null:c.dataset.k;cal()})}
function list(){const s=q.toLowerCase(),L=D.filter(e=>(yr==="all"||e[0].startsWith(yr))&&(!s||e[1].toLowerCase().includes(s)));
 let h="",last="";
 L.forEach(e=>{const k=e[0].slice(0,7);if(k!==last){last=k;const n=L.filter(x=>x[0].startsWith(k)).length;h+=`<div class="mh">${MN[+k.slice(5)-1]} ${k.slice(0,4)} · ${n}</div>`}h+=card(e)});
 $("ll").innerHTML=h||'<div class="e">Nothing found 🔍</div>';
 document.querySelectorAll("[data-y]").forEach(b=>b.classList.toggle("on",b.dataset.y===yr))}
function render(){$("cal").hidden=view!=="cal";$("lst").hidden=view!=="lst";$("arc").hidden=view!=="arc";$("ta").classList.toggle("on",view==="arc");
 $("tc").classList.toggle("on",view==="cal");$("tl").classList.toggle("on",view==="lst");view==="cal"?cal():view==="lst"?list():arcr()}
const cy=y=>D.filter(e=>e[0].startsWith(y)).length;
$("chips").innerHTML=[`💙 ${D.length} moments`,`✦ ${cy("2025")} in 2025`,`❤️ ${cy("2026")} in 2026`].map(x=>`<span>${x}</span>`).join("")+`<a href="${AU}" target="_blank" rel="noopener">🏠 Archive</a>`;
$("tc").onclick=()=>{view="cal";render()};$("tl").onclick=()=>{view="lst";render()};$("ta").onclick=()=>{view="arc";render()};
$("p").onclick=()=>{mi--;sel=null;cal()};$("n").onclick=()=>{mi++;sel=null;cal()};$("cl").onclick=()=>{sel=null;cal()};
$("q").oninput=e=>{q=e.target.value;list()};
document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{yr=b.dataset.y;list()});
render();
</script></body></html>
