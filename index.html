<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0f5ff;--card:#fff;--tx:#10203f;--mut:#5b6b90;--bd:#d0dbf5;--ac:#d91e36;--acs:#e2ebff;--g1:#e11d48;--g2:#2563eb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1128;--card:#121c3d;--tx:#eef2ff;--mut:#9fb0dc;--bd:#243566;--ac:#ff6b7d;--acs:#1b2b5e;--g1:#ff4d5e;--g2:#5b8cff}}
:root[data-theme="dark"]{--bg:#0a1128;--card:#121c3d;--tx:#eef2ff;--mut:#9fb0dc;--bd:#243566;--ac:#ff6b7d;--acs:#1b2b5e;--g1:#ff4d5e;--g2:#5b8cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:var(--tx);background:radial-gradient(circle at 10% 0,var(--acs),transparent 45%),radial-gradient(circle at 100% 20%,var(--acs),transparent 40%),var(--bg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{margin:0;font-size:24px;line-height:1.15;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px;margin:4px 0 14px}
button,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:7px 13px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.on{background:linear-gradient(90deg,var(--g1),var(--g2))!important;color:#fff!important;border-color:transparent!important}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.nav b{font-size:17px}
.nav button:disabled{opacity:.3}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.w{text-align:center;color:var(--mut);font-size:12px}
.d{aspect-ratio:1/1.05;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:13px;cursor:pointer}
.d.o{visibility:hidden}.d.t{border-color:var(--g1);font-weight:700}.d.s{background:var(--acs);border-color:var(--g1)}
.dots{display:flex;gap:3px;margin-top:auto;margin-bottom:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2))}
.h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;color:var(--mut);font-size:13px}
.c{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.b{min-width:44px;text-align:center;border-radius:10px;background:var(--acs);color:var(--ac);padding:4px 0;font-size:11px;line-height:1.1;height:fit-content}.b strong{display:block;font-size:19px}
.c .t{font-weight:600;margin:1px 0 6px;word-break:break-word}.c small{color:var(--mut)}

.mh{margin:16px 0 8px;font-weight:700;color:var(--ac)}
.f{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.f input{flex:1 1 100%}.f button{padding:5px 12px}
.e{color:var(--mut);text-align:center;padding:16px}.ft{text-align:center;color:var(--mut);font-size:12px;margin-top:24px}

body{background:radial-gradient(circle at 0 0,var(--acs),transparent 45%),radial-gradient(circle at 100% 30%,var(--acs),transparent 40%),var(--bg)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;margin-bottom:14px;color:#fff;background:linear-gradient(115deg,#1d4ed8 0%,#4338ca 48%,#be123c 100%);box-shadow:0 10px 30px -12px #4338ca99}
.hero>*{position:relative;z-index:1}
.mono{display:flex}.mono span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;border:2px solid #fff;box-shadow:0 4px 12px #0004}
.mono span:first-child{background:#2563eb}.mono span:last-child{background:#e11d48;margin-left:-14px}
h1{background:none;-webkit-background-clip:initial;background-clip:initial;color:#fff;font-size:32px;font-weight:800;letter-spacing:-.5px;margin:12px 0 0;text-shadow:0 2px 12px #0005}
.tag{font-size:13px;opacity:.92;margin:2px 0 12px;letter-spacing:.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:#ffffff26;border:1px solid #ffffff66;border-radius:99px;padding:3px 11px;font-size:12px}
.tabs{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px}.tabs button{border:0;background:transparent;border-radius:99px}
.b{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff}
.c{position:relative;overflow:hidden;padding-left:16px;box-shadow:0 6px 18px -14px var(--g2)}
.c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--g2),var(--g1))}
.hs{color:var(--g2);font-weight:700}
.mh{display:flex;align-items:center;gap:8px}.mh::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--g2),var(--g1),transparent)}
.ft{margin-top:34px;text-align:center;color:var(--mut)}
.ft .ln{height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#2563eb,#e11d48,transparent);margin-bottom:16px}
.ft .wm{font-size:28px;font-weight:800;letter-spacing:6px;background:linear-gradient(90deg,#2563eb,#e11d48);-webkit-background-clip:text;background-clip:text;color:transparent}
.ft p{margin:6px 0 0;font-size:13px}.ft .sm{font-size:11px;opacity:.8;letter-spacing:.4px}
.chips a{background:#fff;color:#be123c;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;text-decoration:none}
.big{display:block;text-align:center;text-decoration:none;color:#fff;font-weight:800;padding:14px;border-radius:16px;margin-bottom:12px;background:linear-gradient(115deg,#1d4ed8,#be123c)}.big small{color:#fff;opacity:.9;font-weight:400}
.ft a{color:var(--ac)}
.hero .ph{position:absolute;z-index:0;right:0;top:0;height:100%;width:56%;object-fit:cover;object-position:50% 22%;-webkit-mask-image:linear-gradient(to right,transparent,#000 50%);mask-image:linear-gradient(to right,transparent,#000 50%)}
.hero::after{display:none}
.hero .ph{position:relative;z-index:0;display:block;right:auto;top:auto;width:calc(100% + 36px);height:auto;aspect-ratio:16/11;margin:-20px -18px 0;object-fit:cover;object-position:50% 25%;-webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent);mask-image:linear-gradient(to bottom,#000 58%,transparent)}
.hero .mono{margin-top:-44px}
#g{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:12px 10px;gap:5px;box-shadow:0 16px 34px -22px var(--g2)}
.w{font-weight:700;font-size:11px;letter-spacing:.8px;padding:4px 0 6px}.w:nth-child(1){color:var(--g1)}.w:nth-child(7){color:var(--g2)}
.d{background:transparent;border:1px solid transparent;border-radius:14px;padding:5px 2px 3px;justify-content:space-between;position:relative;transition:transform .15s}
.d:active{transform:scale(.93)}
.d .n{font-weight:600;font-size:14px}.d.su .n{color:var(--g1)}.d.sa .n{color:var(--g2)}
.d .em{font-size:17px;line-height:1;min-height:17px}
.d.ev{background:linear-gradient(160deg,transparent,var(--acs));border-color:var(--bd)}
.ct{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;padding:0 4px;font-size:10px;line-height:16px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g1))}
.d.t{background:linear-gradient(135deg,var(--g2),var(--g1));border-color:transparent;box-shadow:0 8px 18px -8px var(--g1)}.d.t .n{color:#fff}
.d.s{outline:2px solid var(--g1);outline-offset:1px;background:var(--acs)}.d.t.s{background:linear-gradient(135deg,var(--g2),var(--g1))}
.nav b{font-size:21px;font-weight:800;background:linear-gradient(90deg,var(--g2),var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
#p,#n{width:42px;height:42px;padding:0;border:0;border-radius:50%;font-size:22px;line-height:1;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g1));box-shadow:0 8px 16px -10px var(--g1)}
#td{padding:4px 12px;font-size:13px;color:var(--ac);border-color:var(--g1)}
.nbn{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 10px 8px 14px;border-radius:14px;color:#fff;font-weight:600;background:linear-gradient(115deg,var(--g2),var(--g1));box-shadow:0 8px 20px -12px var(--g1)}
.nbn span{flex:1}.nbn button{background:#ffffff2e;color:#fff;border:1px solid #ffffff66;border-radius:99px;padding:3px 12px}
.nb{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:1px 7px;border-radius:99px;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g1));vertical-align:middle}
.chips button{background:#ffffff26;color:#fff;border:1px solid #ffffff66;border-radius:99px;padding:3px 11px;font-size:12px}
.stc{background:#ffffff26;border:1px solid #ffffff66;color:#fff;border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer}

 L.forEach(e=>{const k=e[0].slice(0,7);if(k!==last){last=k;const n=L.filter(x=>x[0].startsWith(k)).length;h+=`<div class="mh">${MN[+k.slice(5)-1]} ${k.slice(0,4)} · ${n}</div>`}h+=card(e)});
 $("ll").innerHTML=h||'<div class="e">Nothing found 🔍</div>';
 document.querySelectorAll("[data-y]").forEach(b=>b.classList.toggle("on",!nw&&b.dataset.y===yr))}
function render(){$("cal").hidden=view!=="cal";$("lst").hidden=view!=="lst";$("arc").hidden=view!=="arc";$("ta").classList.toggle("on",view==="arc");
 $("tc").classList.toggle("on",view==="cal");$("tl").classList.toggle("on",view==="lst");view==="cal"?cal():view==="lst"?list():arcr()}
function chips(){const cy=y=>D.filter(e=>e[0].startsWith(y)).length;
$("chips").innerHTML=[`💙 ${D.length} moments`,`✦ ${cy("2025")} in 2025`,`❤️ ${cy("2026")} in 2026`].map(x=>`<span>${x}</span>`).join("")+`<button class="stc" id="st">${ST==="Live ✓"?"● ":"○ "}${ST}</button><a href="${AU}" target="_blank" rel="noopener">🏠 Archive</a>`;
$("st").onclick=()=>refresh(true);bell()}
function banner(){if(!NEW.size)return;$("nb").hidden=false;$("nbt").textContent="✨ "+NEW.size+" new or updated moment"+(NEW.size>1?"s":"");$("nbs").onclick=()=>{nw=true;view="lst";$("nb").hidden=true;render()};$("nbx").onclick=()=>{$("nb").hidden=true}}
async function getRows(k){const r=await fetch("https://docs.google.com/spreadsheets/d/"+SH[k]+"/gviz/tq?tqx=out:csv&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const rows=parseCSV(await r.text());if(FN[k](rows).length<FN[k](SEEDR[k]).length*.8)throw 1;return rows}
async function refresh(man){if(busy||(!man&&Date.now()-lastR<20000))return;busy=true;lastR=Date.now();ST="Checking…";chips();
 const ks=Object.keys(SH),res=await Promise.allSettled(ks.map(getRows)),rows={},bad=[];
 ks.forEach((k,i)=>{if(res[i].status==="fulfilled")rows[k]=res[i].value;else{rows[k]=SEEDR[k];bad.push(NM[k])}});
 const live=buildAll(rows);let add=0;
 if(bad.length<ks.length&&live.length>=D.length*.8){live.forEach(e=>{const k=kk(e);if(!SEEN.has(k)){NEW.add(k);add++}});D=live;saveSeen(D.map(kk));ST=bad.length?"Live · "+bad.length+" unreachable":"Live ✓"}
 else ST="Saved copy";
 busy=false;render();chips();banner();
 if(add&&document.hidden&&typeof Notification!=="undefined"&&Notification.permission==="granted"&&localStorage.getItem("we_notify")==="1")navigator.serviceWorker.ready.then(r=>r.showNotification("WE Calendar 💙",{body:add+" new or updated moment"+(add>1?"s":"")+" added",icon:"icon-192.png",badge:"icon-192.png",tag:"we-update"})).catch(()=>{});
 if(man)alert(bad.length?"Couldn't read: "+bad.join(", ")+".\nSet each sheet to Share > Anyone with the link > Viewer.":"All sheets are up to date 💙")}
chips();
$("tc").onclick=()=>{view="cal";render()};$("tl").onclick=()=>{view="lst";render()};$("ta").onclick=()=>{view="arc";render()};
$("p").onclick=()=>{mi--;sel=null;cal()};$("n").onclick=()=>{mi++;sel=null;cal()};$("cl").onclick=()=>{sel=null;cal()};$("td").onclick=()=>{mi=Math.min(Math.max(now.getFullYear()*12+now.getMonth(),MIN),MAX);sel=null;cal()};
$("q").oninput=e=>{q=e.target.value;list()};
document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{yr=b.dataset.y;nw=false;list()});
render();
banner();
refresh();setInterval(()=>refresh(),180000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
function bell(){if(!("Notification" in window&&"serviceWorker" in navigator))return;
 $("chips").insertAdjacentHTML("beforeend",'<button id="bell"></button>');const bl=$("bell");
 const on=()=>Notification.permission==="granted"&&localStorage.getItem("we_notify")==="1";
 const bs=()=>{bl.textContent=on()?"🔔 Alerts on":"🔔 Alerts"};bs();
 bl.onclick=async()=>{try{const r=await navigator.serviceWorker.ready;
  if(on()){localStorage.removeItem("we_notify");try{await r.periodicSync.unregister("we-check")}catch(e){}}
  else{const p=await Notification.requestPermission();if(p==="granted"){localStorage.setItem("we_notify","1");try{await r.periodicSync.register("we-check",{minInterval:12*3600*1000})}catch(e){}
   r.showNotification("WE Calendar 💙",{body:"Alerts are on. You'll be told when new moments are added.",icon:"icon-192.png"})}}
  bs()}catch(e){}}}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
